<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLearning Academic PDF</title>
  <link rel="stylesheet" href="./sidepanel.css">
</head>
<body>
  <header>
    <h1>newSave: Academic PDF Queue</h1>
    <span class="badge" id="queue-badge">0</span>
  </header>

  <div class="action-bar">
    <button class="btn btn-primary" id="btn-add-current">
      Add Current Page
    </button>
    <button class="btn btn-danger" id="btn-clear-all" title="Clear all queued pages">
      Clear
    </button>
  </div>

  <div id="status-banner" class="status-banner" style="display: none;"></div>

  <div class="queue-container" id="queue-list">
    <!-- Queued cards rendered here -->
  </div>

  <div id="consent-gate" class="consent-gate-overlay" style="display: none;">
    <div class="consent-gate-card">
      <div class="consent-gate-icon">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h2>Setup Required</h2>
      <p>Please review and agree to the Terms of Service & Privacy Policy to use newSave.</p>
      <button class="btn btn-primary" id="btn-open-consent">Review & Agree</button>
    </div>
  </div>

  <footer>
    <div class="layout-toggle-group">
      <label for="sidepanel-layout">Layout Style:</label>
      <select id="sidepanel-layout">
        <option value="single-column">Single Column (Report)</option>
        <option value="two-column">Two Column (IEEE/ACM)</option>
      </select>
    </div>
    <button class="btn btn-compile" id="btn-compile-pdf">
      Compile PDF
    </button>
  </footer>

  <script type="module" src="./sidepanel.ts"></script>
</body>
</html>
